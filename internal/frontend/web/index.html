<!doctype html>
<html lang="en" class="flex flex-col min-h-screen">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rémanence — Send self-destructing messages. No registration, no tracking, no trace." />
    <title>Rémanence — Ephemeral Messages</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html {
        background-color: #0f0f10;
        color: #f5f5f5;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      /* Fade in */
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-up { animation: fadeUp 0.5s ease-out both; }
      .fade-up-d1 { animation: fadeUp 0.5s ease-out 0.1s both; }
      .fade-up-d2 { animation: fadeUp 0.5s ease-out 0.2s both; }
      .fade-up-d3 { animation: fadeUp 0.5s ease-out 0.35s both; }
      /* Subtle glow on textarea focus */
      textarea { transition: box-shadow 0.2s ease, border-color 0.2s ease; }
      textarea:focus { outline: 0 !important; box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1); border-color: rgba(220, 38, 38, 0.3); }
      /* Toggle switch */
      .tgl { display: none; }
      .tgl + .tgl-btn {
        outline: 0; display: block; width: 57px; height: 27px;
        position: relative; cursor: pointer; user-select: none;
        background: #374151; border-radius: 20rem; padding: 2px;
        transition: all 0.4s ease; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
      }
      /* Knob */
      .tgl + .tgl-btn:after {
        position: relative; display: block; content: ""; width: 23px; height: 23px;
        left: 0; border-radius: 50%; background: #d1d5db;
        transition: left 0.3s cubic-bezier(0.175,0.885,0.32,1.275), padding 0.3s ease, margin 0.3s ease;
        box-shadow: 0 1px 2px 0 rgba(0,0,0,0.3);
      }
      .tgl:checked + .tgl-btn { background: #dc2626; }
      .tgl:checked + .tgl-btn:after { left: 30px; background: #fff; }
      .tgl + .tgl-btn:active { box-shadow: inset 0 0 0 30px rgba(0,0,0,0.1); }
      .tgl + .tgl-btn:active:after { padding-right: 0.4em; }
      .tgl:checked + .tgl-btn:active:after { margin-left: -0.4em; }
      /* Popup overlay */
      .popup-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.7);
        display: flex; align-items: center; justify-content: center;
        backdrop-filter: blur(8px); z-index: 50;
        animation: fadeUp 0.2s ease-out both;
      }
      /* Secret message reveal */
      @keyframes revealMessage {
        from { opacity: 0; transform: scale(0.97); filter: blur(4px); }
        to { opacity: 1; transform: scale(1); filter: blur(0); }
      }
      .reveal { animation: revealMessage 0.6s ease-out both; }
    </style>
  </head>

  <body class="flex flex-col flex-1 items-center">

    <!-- Hero -->
    <header class="flex flex-col items-center mt-12 sm:mt-16 mb-6 fade-up">
      <img src="./logo.png" alt="Rémanence" class="w-28 h-28 sm:w-36 sm:h-36 object-contain mb-4 rounded-3xl" />
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">Send messages that <span class="text-red-500">vanish</span>.</h1>
      <p class="text-gray-500 text-sm mt-2 max-w-md text-center">Write something confidential, share the link — it self-destructs after being read. No account needed.</p>
    </header>

    <!-- Main content -->
    <div
      id="message-container"
      class="flex flex-col items-center justify-center text-center text-gray-100 transition-all overflow-y-auto p-4 rounded-lg w-[92%] max-w-3xl fade-up-d1"
    ></div>

    <!-- Trust indicators -->
    <div id="trust-badges" class="flex gap-6 sm:gap-8 mt-8 mb-6 text-gray-600 text-xs fade-up-d3">
      <span class="flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        No tracking
      </span>
      <span class="flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        No registration
      </span>
      <span class="flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
        Open source
      </span>
    </div>

    <!-- Footer -->
    <footer class="mt-auto w-full text-center text-gray-600 text-xs py-6">
      <a href="/about" class="hover:text-gray-400 transition-colors">About <strong class="text-red-500/70">Rémanence</strong></a>
      <span class="mx-2">·</span>
      <a href="https://github.com/sponsors/ThiraSoft" target="_blank" rel="noopener noreferrer" class="hover:text-red-400 transition-colors">Support the project</a>
      <span class="mx-2">·</span>
      <span>&copy; 2025</span>
    </footer>

    <script>
      const MAX_LENGTH = 1024;
      const container = document.getElementById("message-container");

      function escapeHtml(text) {
        const d = document.createElement("div");
        d.textContent = text;
        return d.innerHTML;
      }

      // Dismiss popup on Escape
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          const overlay = document.querySelector(".popup-overlay");
          if (overlay) overlay.remove();
        }
      });

      // Human-readable time from minutes
      function humanTime(min) {
        if (min < 60) return min + " min";
        const h = Math.floor(min / 60);
        const m = min % 60;
        if (m === 0) return h + "h";
        return h + "h " + m + "m";
      }

      // ── Load existing message ──
      function loadMessage(id) {
        // Hide trust badges and tagline when viewing a message
        document.getElementById("trust-badges").style.display = "none";
        document.querySelector("header p").style.display = "none";
        document.querySelector("header h1").innerHTML = 'Someone sent you a <span class="text-red-500">secret</span>.';

        container.innerHTML = `
          <div class="flex flex-col items-center py-8">
            <svg class="w-12 h-12 text-red-500/50 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            <p class="text-gray-500 text-sm mt-3">Decrypting...</p>
          </div>
        `;

        fetch(`/api/v1/messages/${encodeURIComponent(id)}`)
          .then((r) => r.json())
          .then((data) => {
            if (data.error) {
              container.innerHTML = `
                <div class="flex flex-col items-center py-6">
                  <svg class="w-12 h-12 text-gray-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.5c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"/>
                  </svg>
                  <p class="text-gray-400 text-lg font-medium mb-1">This message is gone</p>
                  <p class="text-gray-600 text-sm mb-6">It was already read or has expired.</p>
                  <a href="/" class="px-5 py-2.5 bg-red-600 hover:bg-red-500 rounded-lg text-white text-sm font-medium transition-all">Create your own</a>
                </div>
              `;
              return;
            }
            const escaped = escapeHtml(data.content);
            container.innerHTML = `
              <div class="w-full reveal">
                <p class="text-gray-600 text-xs mb-3 flex items-center justify-center gap-1.5">
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                  Click to copy
                </p>
                <div id="copyDiv" class="cursor-pointer break-words text-gray-200 bg-gray-800/80 hover:bg-gray-800 p-6 rounded-xl whitespace-pre-wrap text-left transition-all duration-200 border border-gray-700/50 text-sm leading-relaxed">${escaped}</div>
                <div id="copyNotice" class="text-xs text-green-400 opacity-0 transition-opacity duration-300 mt-2 mb-6">Copied to clipboard!</div>
                <a href="/" class="inline-block px-5 py-2.5 bg-red-600 hover:bg-red-500 rounded-lg text-white text-sm font-medium transition-all">Create your own</a>
                <p class="text-gray-700 text-xs mt-6">Rémanence is free and respects your privacy. <a href="https://github.com/sponsors/ThiraSoft" target="_blank" rel="noopener noreferrer" class="text-gray-500 hover:text-red-400 transition-colors underline underline-offset-2">Help keep it running.</a></p>
              </div>
            `;
            const copyDiv = document.getElementById("copyDiv");
            const notice = document.getElementById("copyNotice");
            copyDiv.addEventListener("click", async () => {
              try {
                await navigator.clipboard.writeText(data.content);
                copyDiv.classList.add("!bg-gray-700", "!border-gray-600");
                setTimeout(() => copyDiv.classList.remove("!bg-gray-700", "!border-gray-600"), 200);
                notice.style.opacity = 1;
                setTimeout(() => (notice.style.opacity = 0), 2500);
              } catch {
                const range = document.createRange();
                range.selectNodeContents(copyDiv);
                window.getSelection().removeAllRanges();
                window.getSelection().addRange(range);
              }
            });
          })
          .catch(() => {
            container.innerHTML = `
              <div class="flex flex-col items-center py-6">
                <p class="text-red-400 font-medium mb-2">Something went wrong</p>
                <p class="text-gray-600 text-sm mb-6">Please try again later.</p>
                <a href="/" class="px-5 py-2.5 bg-red-600 hover:bg-red-500 rounded-lg text-white text-sm font-medium transition-all">Back to home</a>
              </div>
            `;
          });
      }

      // ── Create message ──
      async function postMessageWithSettings(content, lifeLimit, isOneShot) {
        const formData = new FormData();
        formData.append("content", content);
        formData.append("lifeLimit", lifeLimit);
        formData.append("isOneShot", isOneShot);

        const btn = document.getElementById("submit-btn");
        if (btn) { btn.disabled = true; btn.textContent = "Sending..."; }

        try {
          const response = await fetch("/api/v1/messages", { method: "POST", body: formData });
          if (!response.ok) {
            const err = await response.json().catch(() => null);
            showError(err?.error || `Error: ${response.status}`);
            return;
          }
          const data = await response.json();
          displaySuccessPopup(data.id, isOneShot);
          const input = document.getElementById("message-input");
          if (input) { input.value = ""; updateCharCount(); }
        } catch {
          showError("Network error. Please try again.");
        } finally {
          if (btn) { btn.disabled = false; btn.textContent = "Send"; }
        }
      }

      function showError(msg) {
        let el = document.getElementById("error-msg");
        if (!el) {
          el = document.createElement("p");
          el.id = "error-msg";
          el.className = "text-red-400 text-sm mt-2 transition-opacity duration-300";
          container.appendChild(el);
        }
        el.textContent = msg;
        el.style.opacity = 1;
        setTimeout(() => { el.style.opacity = 0; }, 4000);
      }

      // ── Settings popup ──
      function messageSettingsPopup() {
        const input = document.getElementById("message-input");
        if (!input || !input.value.trim()) {
          showError("Please type a message first.");
          return;
        }

        const popup = document.createElement("div");
        popup.className = "popup-overlay";
        popup.innerHTML = `
          <div class="flex flex-col bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-2xl w-[90%] max-w-sm" onclick="event.stopPropagation()">
            <h2 class="text-white text-base font-semibold mb-1">Before sending</h2>
            <p class="text-gray-600 text-xs mb-6">Choose how and when the message disappears.</p>

            <label class="text-gray-400 flex items-center justify-between text-sm">
              <span>Burn after reading</span>
              <div>
                <input class="tgl" id="isOneShot" type="checkbox" checked />
                <label class="tgl-btn" for="isOneShot"></label>
              </div>
            </label>

            <div class="h-px bg-gray-800 my-5"></div>

            <label class="text-gray-400 flex flex-col gap-3 text-sm">
              <span id="lifeLimitLabel">Maximum lifetime:</span>
              <input type="range" id="lifeLimit" min="1" max="1440" value="1440" class="accent-red-600" />
              <span id="lifeLimitValue" class="text-white text-center text-lg font-mono font-semibold">24h</span>
            </label>
            <p id="settingsHint" class="text-gray-600 text-xs mt-2 text-center transition-all duration-200"></p>

            <button id="confirmBtn" class="mt-6 py-3 bg-red-600 hover:bg-red-500 rounded-xl text-white font-medium transition-all text-sm">Send message</button>
          </div>
        `;
        const handleEnter = (e) => {
          if (e.key === "Enter") {
            document.getElementById("confirmBtn")?.click();
          }
        };
        setTimeout(() => {
          document.addEventListener("keyup", handleEnter);
        }, 0);

        const cleanup = () => {
          document.removeEventListener("keyup", handleEnter);
        };

        popup.addEventListener("click", (e) => { 
          if (e.target === popup) {
            popup.remove();
            cleanup();
          }
        });
        document.body.appendChild(popup);

        const oneShotEl = document.getElementById("isOneShot");
        const lifeLimitEl = document.getElementById("lifeLimit");
        const hintEl = document.getElementById("settingsHint");
        const labelEl = document.getElementById("lifeLimitLabel");
        const valueEl = document.getElementById("lifeLimitValue");

        function updateSettingsHint() {
          valueEl.textContent = humanTime(+lifeLimitEl.value);
          if (oneShotEl.checked) {
            labelEl.textContent = "Maximum lifetime:";
            hintEl.textContent = "Destroyed on first read, or after " + humanTime(+lifeLimitEl.value) + " if unread.";
          } else {
            labelEl.textContent = "Self-destruct after:";
            hintEl.textContent = "Readable multiple times, destroyed after " + humanTime(+lifeLimitEl.value) + ".";
          }
        }

        oneShotEl.addEventListener("change", updateSettingsHint);
        lifeLimitEl.addEventListener("input", updateSettingsHint);
        updateSettingsHint();

        document.getElementById("confirmBtn").addEventListener("click", () => {
          const content = input.value.trim();
          const lifeLimit = lifeLimitEl.value;
          const isOneShot = oneShotEl.checked;
          popup.remove();
          cleanup();
          postMessageWithSettings(content, lifeLimit, isOneShot);
        });
      }

      // ── Success popup ──
      function displaySuccessPopup(messageId, isOneShot) {
        const messageUrl = `${window.location.origin}?message=${messageId}`;
        const popup = document.createElement("div");
        popup.className = "popup-overlay";
        popup.innerHTML = `
          <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl shadow-2xl text-center w-[90%] max-w-md" onclick="event.stopPropagation()">
            <div class="w-12 h-12 mx-auto mb-4 rounded-full bg-green-500/10 flex items-center justify-center">
              <svg class="w-6 h-6 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            </div>
            <h2 class="text-white text-base font-semibold mb-1">Ready to share</h2>
            <p class="text-gray-500 text-xs mb-4">Anyone with this link can read the message${isOneShot ? " — once" : ""}.</p>
            <p id="urlDisplay" class="text-red-400 font-mono text-xs p-3 bg-black/40 rounded-xl cursor-pointer transition-all hover:bg-black/60 break-all border border-gray-800">${escapeHtml(messageUrl)}</p>
            <div id="copyNotice2" class="text-xs text-green-400 opacity-0 transition-opacity duration-300 mt-2 h-5">Copied!</div>
            <button id="closeBtn" class="w-full mt-2 py-3 bg-gray-800 hover:bg-gray-700 rounded-xl text-gray-300 text-sm font-medium transition-all">Done</button>
            <div class="mt-4 pt-4 border-t border-gray-800/60">
              <p class="text-gray-600 text-xs mb-2.5">Rémanence is free, ad-free, and funded by people like you.</p>
              <a href="https://github.com/sponsors/ThiraSoft" target="_blank" rel="noopener noreferrer"
                class="inline-flex items-center gap-1.5 text-xs text-gray-400 hover:text-red-400 transition-colors">
                <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                Support the project
              </a>
            </div>
          </div>
        `;
        popup.addEventListener("click", (e) => { if (e.target === popup) popup.remove(); });
        document.body.appendChild(popup);

        const notice = document.getElementById("copyNotice2");
        let noticeTimer = null;
        function flashCopied(text) {
          if (text !== undefined) notice.textContent = text;
          if (noticeTimer) clearTimeout(noticeTimer);
          notice.style.opacity = 1;
          noticeTimer = setTimeout(() => (notice.style.opacity = 0), 2500);
        }

        // Auto-copy
        navigator.clipboard.writeText(messageUrl).then(() => flashCopied("Copied!")).catch(() => {});

        document.getElementById("closeBtn").addEventListener("click", () => popup.remove());
        document.getElementById("urlDisplay").addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(messageUrl);
            flashCopied("Copied!");
          } catch {
            const range = document.createRange();
            range.selectNodeContents(document.getElementById("urlDisplay"));
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            flashCopied("Press Ctrl/Cmd+C to copy");
          }
        });
      }

      // ── Character counter ──
      function updateCharCount() {
        const input = document.getElementById("message-input");
        const counter = document.getElementById("char-count");
        const btn = document.getElementById("submit-btn");
        if (!input || !counter) return;
        const len = [...input.value].length;
        counter.textContent = `${len} / ${MAX_LENGTH}`;
        counter.className = len > MAX_LENGTH
          ? "text-red-400 text-xs mt-1.5"
          : "text-gray-600 text-xs mt-1.5";
        if (btn) btn.disabled = len === 0 || len > MAX_LENGTH;
      }

      // ── Init ──
      const params = new URLSearchParams(window.location.search);
      const preId = params.get("message");
      if (preId) {
        loadMessage(preId);
      } else {
        container.innerHTML = `
          <textarea
            id="message-input"
            placeholder="Type your secret message here..."
            maxlength="${MAX_LENGTH + 100}"
            class="w-full resize-none h-44 bg-gray-900/80 text-gray-200 p-5 rounded-xl focus:outline-none border border-gray-800 transition-all text-sm leading-relaxed placeholder-gray-700"
          ></textarea>
          <div class="flex justify-between items-center w-full px-1">
            <span id="char-count" class="text-gray-600 text-xs mt-1.5">0 / ${MAX_LENGTH}</span>
            <div class="flex items-center gap-3 mt-1.5">
              <span id="shortcut-label" class="text-gray-700 text-xs hidden sm:inline"></span>
              <button
                id="submit-btn"
                disabled
                class="px-6 py-2 bg-red-600 hover:bg-red-500 disabled:opacity-30 disabled:cursor-not-allowed rounded-lg transition-all text-white text-sm font-medium"
              >Send</button>
            </div>
          </div>
        `;
        const input = document.getElementById("message-input");
        input.addEventListener("input", updateCharCount);
        input.addEventListener("keyup", (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
            e.preventDefault();
            e.stopPropagation();
            messageSettingsPopup();
          }
        });
        document.getElementById("submit-btn").addEventListener("click", () => messageSettingsPopup());
        
        // OS-specific shortcut label
        const isMac = /Mac|iPod|iPhone|iPad/.test(navigator.platform);
        const labelEl = document.getElementById("shortcut-label");
        if (labelEl) labelEl.textContent = isMac ? "⌘+Enter" : "Ctrl+Enter";

        // Auto-focus textarea
        input.focus();
      }
    </script>
  </body>
</html>
